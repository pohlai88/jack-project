name: Lint

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repo guard
        run: pnpm repo:guard

      - name: Run i18n check
        run: pnpm i18n:check

      - name: Run i18n inventory check
        run: pnpm i18n:inventory:check

      - name: Run i18n compile check
        run: pnpm i18n:compile --check

      - name: Run i18n coverage
        run: pnpm i18n:coverage

      - name: Run i18n fallback check
        run: pnpm i18n:fallback-check

      - name: Run docs check
        run: pnpm docs:check

      - name: Run i18n readiness report
        run: pnpm i18n:readiness:report

      - name: Verify landing design system
        run: pnpm verify-landing-design-system

      - name: Run lint
        run: pnpm lint
