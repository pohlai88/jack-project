name: Docs Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - content/i18n/docs/**
      - scripts/docs-evidence-pipeline.ts
      - scripts/docs-content-policy.ts
      - scripts/docs-validate-links.ts
      - source.config.ts
      - src/app/**
      - src/docs/**
      - src/features/**
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml

  push:
    branches:
      - main
    paths:
      - content/i18n/docs/**
      - scripts/docs-evidence-pipeline.ts
      - scripts/docs-content-policy.ts
      - scripts/docs-validate-links.ts
      - source.config.ts
      - src/app/**
      - src/docs/**
      - src/features/**
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  docs-evidence:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run docs evidence gate
        run: pnpm docs:ci
        env:
          SKIP_ENV_VALIDATION: true
