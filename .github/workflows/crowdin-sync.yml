name: Crowdin Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Upload source, download translations, or run both.
        required: true
        default: both
        type: choice
        options:
          - upload-source
          - download-translations
          - both

  push:
    branches:
      - main
    paths:
      - src/i18n/catalogs/source/en.json
      - crowdin.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin-sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      I18N_PLATFORM_SYNC: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upload English source to Crowdin
        if: github.event_name == 'push' || github.event.inputs.mode == 'upload-source' || github.event.inputs.mode == 'both'
        run: pnpm i18n:platform:upload-source

      - name: Download Crowdin translations
        if: github.event.inputs.mode == 'download-translations' || github.event.inputs.mode == 'both'
        run: pnpm i18n:platform:download-translations

      - name: Compile runtime messages
        if: github.event.inputs.mode == 'download-translations' || github.event.inputs.mode == 'both'
        run: pnpm i18n:compile

      - name: Validate downloaded translations
        if: github.event.inputs.mode == 'download-translations' || github.event.inputs.mode == 'both'
        run: |
          pnpm i18n:validate
          pnpm i18n:coverage
          pnpm i18n:fallback-check

      - name: Create localization PR
        if: github.event.inputs.mode == 'download-translations' || github.event.inputs.mode == 'both'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: i18n/crowdin-sync
          title: 'chore(i18n): sync Crowdin translations'
          commit-message: 'chore(i18n): sync Crowdin translations'
          body: |
            Crowdin translation sync.

            Validation run:
            - pnpm i18n:compile
            - pnpm i18n:validate
            - pnpm i18n:coverage
            - pnpm i18n:fallback-check
          labels: i18n-platform-sync
          delete-branch: true
